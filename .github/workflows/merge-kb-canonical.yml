name: Merge KB canonical NID

on:
  push:
    paths:
      - '.github/workflows/merge-kb-canonical.yml'

permissions:
  contents: write

jobs:
  merge-kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build canonical kb/nid.ttl
        shell: python
        run: |
          from pathlib import Path

          src = Path('kb/triage/elias.ttl')
          out = Path('kb/nid.ttl')
          text = src.read_text(encoding='utf-8')

          # Canonicalize the local KB namespace to nid.ttl.
          text = text.replace('http://kb.elias.eng.br/nid/elias.ttl#', 'http://kb.elias.eng.br/nid.ttl#')
          text = text.replace('<http://kb.elias.eng.br/nid/elias.ttl>', '<http://kb.elias.eng.br/nid.ttl>')

          # Merge the useful organization labels from the older kb.ttl without
          # duplicating its obsolete namespace/individuals.
          text = text.replace(
              'bdc_org:Brasidata rdf:type owl:NamedIndividual .',
              'bdc_org:Brasidata rdf:type owl:NamedIndividual ;\n'
              '                  schema:name "Brasidata" .'
          )
          text = text.replace(
              'bdc_org:Zigurat rdf:type owl:NamedIndividual .',
              'bdc_org:Zigurat rdf:type owl:NamedIndividual ;\n'
              '                schema:name "Zigurat" .'
          )

          # Zigurat collaboration ended on 2026-08-10.
          text = text.replace(
              'org:hasMembership bdc_org:Brasidata ,\n                              bdc_org:Zigurat ;',
              'org:hasMembership bdc_org:Brasidata ;'
          )
          text = text.replace(
              'cv:startDate "2026-03-01" ;\n                   cv:isCurrent "true" ;',
              'cv:startDate "2026-03-01" ;\n'
              '                   cv:endDate "2026-08-10"^^xsd:date ;\n'
              '                   cv:isCurrent "false"^^xsd:boolean ;'
          )

          # Preserve the useful top-level role statement present only in the
          # older kb.ttl.
          needle = 'schema:owns bdc_org:Brasidata ;\n            cv:hasNationality'
          replacement = (
              'schema:jobTitle "Engenheiro Pesquisador"@pt-br ,\n'
              '                            "Research Engineer"@en ;\n'
              '            schema:owns bdc_org:Brasidata ;\n'
              '            cv:hasNationality'
          )
          if needle in text and 'schema:jobTitle "Engenheiro Pesquisador"@pt-br' not in text:
              text = text.replace(needle, replacement)

          out.write_text(text, encoding='utf-8')

          # Make the existing triage documentation builder consume the
          # canonical file at kb/nid.ttl.
          build = Path('kb/triage/build.py')
          b = build.read_text(encoding='utf-8')
          b = b.replace('ttl_path = base_dir / "nid.ttl"', 'ttl_path = base_dir.parent / "nid.ttl"')
          b = b.replace('base_uri = "http://kb.elias.eng.br/nid/elias.ttl#"', 'base_uri = "http://kb.elias.eng.br/nid.ttl#"')
          build.write_text(b, encoding='utf-8')

      - name: Validate Turtle
        run: |
          python -m pip install rdflib
          python - <<'PY'
          from rdflib import Graph, Namespace, Literal
          from rdflib.namespace import XSD
          g = Graph().parse('kb/nid.ttl', format='turtle')
          CV = Namespace('http://rdfs.org/resume-rdf/cv.rdfs#')
          zig = [s for s in g.subjects(CV.endDate, Literal('2026-08-10', datatype=XSD.date)) if str(s).endswith('#Work_Zigurat')]
          assert zig, 'Work_Zigurat end date not found'
          print(f'Validated {len(g)} triples; Zigurat end recorded.')
          PY

      - name: Commit canonical KB and remove temporary workflow
        run: |
          rm .github/workflows/merge-kb-canonical.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/nid.ttl kb/triage/build.py .github/workflows/merge-kb-canonical.yml
          git commit -m "refactor(kb): consolidate canonical nid and close Zigurat"
          git push
