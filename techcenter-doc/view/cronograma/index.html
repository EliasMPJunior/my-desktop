<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoBIM — Cronograma Geral</title>
  <link
    rel="stylesheet"
    href="../../.__ontobdc__/asset/infobim-view/css/project_dashboard.css"
  >
  <style>
    .schedule-hero {
      padding: clamp(28px, 4vw, 48px);
    }

    .schedule-hero h1 {
      margin: 28px 0 0;
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .schedule-tabs {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-height: 64px;
      margin-top: 16px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(15, 26, 44, 0.88);
    }

    .schedule-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 10px 24px;
      border: 1px solid rgba(103, 232, 249, 0.5);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(103, 232, 249, 0.12);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.8),
        inset 0 0 24px rgba(103, 232, 249, 0.04);
      font-weight: 900;
      text-decoration: none;
      transition:
        border-color 160ms ease,
        background 160ms ease;
    }

    .schedule-tab:hover {
      border-color: var(--accent);
      background: rgba(103, 232, 249, 0.17);
    }

    .schedule-tab:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 620px) {
      .schedule-hero h1 {
        font-size: clamp(2.6rem, 16vw, 4.4rem);
      }

      .schedule-tabs,
      .schedule-tab {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="view-shell">
    <section class="view-hero-card schedule-hero">
      <div class="view-brand">
        <img
          class="view-brand-logo"
          src="../../.__ontobdc__/asset/infobim-view/logo.png"
          alt="InfoBIM"
        >
        <div class="view-brand-copy">
          <span class="view-eyebrow">InfoBIM Cronograma</span>
          <span class="view-eyebrow-meta">
            Real Estate Brazil (Official)-Obras - Exp LabSea2025
          </span>
        </div>
      </div>
      <h1>Cronograma Geral</h1>
    </section>

    <nav class="schedule-tabs" aria-label="Visualizações do cronograma">
      <a
        class="schedule-tab"
        href="./gantt.html"
        aria-current="page"
      >Gantt</a>
    </nav>
  </main>
</body>
</html>
