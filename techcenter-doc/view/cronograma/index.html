<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoBIM — Cronograma Geral</title>
  <link
    rel="stylesheet"
    href="../../.__ontobdc__/asset/infobim-view/css/project_dashboard.css"
  >
  <style>
    .schedule-hero {
      padding: clamp(28px, 4vw, 48px);
    }

    .schedule-hero h1 {
      margin: 28px 0 0;
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .schedule-tabs {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-height: 64px;
      margin-top: 16px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(15, 26, 44, 0.88);
    }

    .schedule-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 10px 24px;
      border: 1px solid rgba(103, 232, 249, 0.5);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(103, 232, 249, 0.12);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.8),
        inset 0 0 24px rgba(103, 232, 249, 0.04);
      font-weight: 900;
      text-decoration: none;
      transition:
        border-color 160ms ease,
        background 160ms ease;
    }

    .schedule-tab:hover {
      border-color: var(--accent);
      background: rgba(103, 232, 249, 0.17);
    }

    .schedule-tab:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .gantt-panel {
      margin-top: 16px;
      overflow: hidden;
    }

    .gantt-canvas {
      position: relative;
      min-height: 560px;
      border-top: 1px solid var(--line);
      background:
        linear-gradient(to right, rgba(159, 176, 200, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(159, 176, 200, 0.08) 1px, transparent 1px),
        rgba(255, 255, 255, 0.012);
      background-size: 48px 100%, 100% 48px;
    }

    .gantt-empty {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(480px, calc(100% - 40px));
      margin: 0;
      color: var(--text-soft);
      line-height: 1.7;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    @media (max-width: 620px) {
      .schedule-hero h1 {
        font-size: clamp(2.6rem, 16vw, 4.4rem);
      }

      .schedule-tabs,
      .schedule-tab {
        width: 100%;
      }

      .gantt-canvas {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <main class="view-shell">
    <section class="view-hero-card schedule-hero">
      <div class="view-brand">
        <img
          class="view-brand-logo"
          src="../../.__ontobdc__/asset/infobim-view/logo.png"
          alt="InfoBIM"
        >
        <div class="view-brand-copy">
          <span class="view-eyebrow">InfoBIM Cronograma</span>
          <span class="view-eyebrow-meta">
            Real Estate Brazil (Official)-Obras - Exp LabSea2025
          </span>
        </div>
      </div>
      <h1>Cronograma Geral</h1>
    </section>

    <nav
      class="schedule-tabs"
      role="tablist"
      aria-label="Visualizações do cronograma"
    >
      <button
        class="schedule-tab"
        id="schedule-tab-gantt"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="schedule-panel-gantt"
      >Gantt</button>
    </nav>

    <section
      class="view-panel gantt-panel"
      id="schedule-panel-gantt"
      role="tabpanel"
      aria-labelledby="schedule-tab-gantt"
      data-dataset="cronograma"
      data-dataset-uri="urn:ontobdc:storage/dataset/techcenter-doc/cronograma"
    >
      <header class="view-panel-head">
        <h2 class="view-panel-title">Cronograma Geral</h2>
      </header>
      <div class="gantt-canvas" id="gantt-chart">
        <p class="gantt-empty">
          Os dados do cronograma ainda não estão definidos nesta visualização.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
